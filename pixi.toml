[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["conda-forge", "bioconda"]
name = "7-integrate-py"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/7-integrate-py.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/7-integrate-py.yml"

[dependencies]
python = ">=3.11"
scanorama = "*"
pyyaml = "*"
h5py = "*"
numpy = "*"
polars = "*"

# env for quick dev tasks - avoid the regular deps
[feature.dev.dependencies]
python = ">=3.11"
pyyaml = ">=6"
curl = "*"

[feature.dev.tasks]
sync = "sh -c 'curl -fsSL https://raw.githubusercontent.com/omni-scrna/boilerplate/${BRANCH:-main}/scripts/pull.py | python -'"

[environments]
dev = { features = ["dev"], no-default-feature = true }
